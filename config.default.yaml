# Gatus Monitoring & Alerting Configuration
# Reference: https://github.com/TwiN/gatus

# Enable Prometheus metrics exporter at /metrics
metrics: true

# Global Connectivity Checker
connectivity-checker:
  target: 1.1.1.1:53
  interval: 30s

# Storage configuration for persisting historical monitoring data
storage:
  type: sqlite
  path: gatus.db

# Web UI configuration
ui:
  title: "Gatus | System Health Dashboard"
  header: "Infrastructure & API Services Health"
  buttons:
    - name: "Main Website"
      link: "https://kalagato.co"
    - name: "Status Docs"
      link: "https://github.com/TwiN/gatus"

# Alerting Configuration (Slack & PagerDuty)
alerting:
  slack:
    webhook-url: "${SLACK_WEBHOOK_URL}"
    default-alert:
      enabled: true
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true
      description: "Health check failed for [ENDPOINT_NAME]"

  pagerduty:
    integration-key: "${PAGERDUTY_INTEGRATION_KEY}"
    default-alert:
      enabled: true
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true
      description: "Service incident triggered for [ENDPOINT_NAME]"

# Endpoints configuration with detailed response validations

endpoints:
  # ==========================================
  # Group: API Monitoring
  # ==========================================

  - name: emi-currency-api
    group: API Monitoring
    url: https://emi-cc-api.kalagato.co/api/currency/
    interval: 180s
    method: POST
    headers:
      Content-Type: application/json
    body: '{"base":"INR","quote":"USD"}'
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[BODY].data.status == success"
      - "[BODY].data.response.base == INR"
    alerts:
      - type: slack
      - type: pagerduty

  - name: hdc-api
    group: API Monitoring
    url: https://hdc-api.kalagato.co/api/v1/
    interval: 180s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[BODY] == pat(*theme*)"
    alerts:
      - type: slack
      - type: pagerduty

  - name: india-gst-api
